<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b5d">
  <title>Corazón AR - Marcador HIRO</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    .ui{position:fixed;inset:0;z-index:20;pointer-events:none}
    .top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}
    .box{background:rgba(18,59,93,.94);color:#fff;border-radius:14px;padding:10px 13px;box-shadow:0 6px 22px rgba(0,0,0,.25)}
    .box b{display:block;margin-bottom:3px}.box small{display:block;line-height:1.3}
    .btn{pointer-events:auto;border:0;border-radius:999px;background:#fff;color:#123b5d;padding:10px 14px;font-weight:700}
    #status{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(88vw,460px);box-sizing:border-box;background:rgba(255,255,255,.95);color:#17212b;border-radius:15px;padding:12px 14px;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.25)}
    #status.ok{background:rgba(226,247,232,.96)}
    #status.warn{background:rgba(255,244,214,.96)}
  </style>
</head>
<body>

<div class="ui">
  <div class="top">
    <div class="box">
      <b>🫀 Corazón AR</b>
      <small>Apunta la cámara al marcador HIRO impreso o mostrado en otra pantalla.</small>
    </div>
    <button class="btn" onclick="location.href='./index.html'">Volver</button>
  </div>
  <div id="status" class="warn">Buscando marcador HIRO…</div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="antialias:true; alpha:true; colorManagement:true;"
  arjs="sourceType:webcam; trackingMethod:best; debugUIEnabled:false;"
>
  <a-assets timeout="20000">
    <a-asset-item id="heartModel" src="./model/heart_ar.glb"></a-asset-item>
  </a-assets>

  <a-marker
    id="hiroMarker"
    preset="hiro"
    emitevents="true"
    smooth="true"
    smooth-count="5"
    smooth-tolerance="0.01"
    smooth-threshold="2"
  >
    <!-- Base verde de prueba: si aparece, HIRO fue detectado -->
    <a-box
      position="0 0.025 0"
      scale="0.85 0.05 0.85"
      material="color:#2e8b57; opacity:0.35; transparent:true">
    </a-box>

    <!-- Corazón -->
    <a-entity
      id="heart"
      gltf-model="#heartModel"
      position="0 0.10 0"
      rotation="-90 0 0"
      scale="2 2 2">
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const marker = document.querySelector("#hiroMarker");
  const heart = document.querySelector("#heart");
  const status = document.querySelector("#status");

  marker.addEventListener("markerFound", () => {
    status.textContent = "✓ HIRO detectado. El corazón está anclado al marcador.";
    status.className = "ok";
  });

  marker.addEventListener("markerLost", () => {
    status.textContent = "Marcador perdido. Acércate y mantén visible todo el borde negro.";
    status.className = "warn";
  });

  heart.addEventListener("model-loaded", () => {
    console.log("Corazón GLB cargado correctamente.");
  });

  heart.addEventListener("model-error", (e) => {
    console.error("Error al cargar el corazón:", e);
    status.textContent = "HIRO puede funcionar, pero hubo un error cargando heart_ar.glb.";
    status.className = "warn";
  });
</script>

</body>
</html>
