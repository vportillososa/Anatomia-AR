<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR.js V3 - HIRO + Cubo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #msg {
      position: fixed;
      z-index: 9999;
      left: 10px;
      right: 10px;
      bottom: 15px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.92);
      color: #17212b;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="msg">Iniciando cámara… Luego apunta al marcador HIRO.</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 480; sourceHeight: 640;"
  >
    <a-marker id="hiro" preset="hiro" emitevents="true">
      <a-box
        position="0 0.5 0"
        material="color: blue; opacity: 0.8; side: double;">
      </a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const msg = document.getElementById("msg");
    const marker = document.getElementById("hiro");

    marker.addEventListener("markerFound", function () {
      msg.textContent = "✓ HIRO detectado: debe verse el cubo azul.";
    });

    marker.addEventListener("markerLost", function () {
      msg.textContent = "HIRO perdido. Mantén visible todo el marcador.";
    });

    window.addEventListener("arjs-video-loaded", function () {
      msg.textContent = "✓ Cámara activa. Ahora apunta al marcador HIRO.";
    });

    window.addEventListener("camera-error", function () {
      msg.textContent = "Error: no se pudo iniciar la cámara.";
    });
  </script>
</body>
</html>
