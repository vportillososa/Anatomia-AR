<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123b5d" />
  <title>Corazón AR con marcador</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }
    .topbar {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .panel {
      background: rgba(18, 59, 93, 0.92);
      color: white;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      max-width: 78%;
      pointer-events: auto;
    }
    .panel strong {
      display: block;
      font-size: 16px;
      margin-bottom: 3px;
    }
    .panel span {
      font-size: 13px;
      line-height: 1.3;
      opacity: .92;
    }
    .back {
      pointer-events: auto;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: white;
      color: #123b5d;
      font-weight: 700;
      cursor: pointer;
    }
    #status {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      width: min(88vw, 460px);
      box-sizing: border-box;
      background: rgba(255,255,255,.94);
      color: #17212b;
      padding: 12px 16px;
      border-radius: 16px;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.25);
      pointer-events: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #123b5d;
      color: white;
      text-align: center;
      padding: 30px;
    }
    #loading.hidden { display: none; }
  </style>
</head>

<body>
  <div id="loading">
    <div>
      <h2>Iniciando cámara AR…</h2>
      <p>Permite el acceso a la cámara cuando Chrome lo solicite.</p>
    </div>
  </div>

  <div class="topbar">
    <div class="panel">
      <strong>🫀 Corazón en Realidad Aumentada</strong>
      <span>Apunta la cámara al marcador HIRO.</span>
    </div>

    <button class="back" type="button" onclick="window.location.href='./index.html'">
      Volver
    </button>
  </div>

  <div id="status">Busca el marcador HIRO con la cámara.</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true;"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
  >
    <a-assets timeout="20000">
      <a-asset-item id="heartModel" src="./models/heart_ar.glb"></a-asset-item>
    </a-assets>

    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smooth-count="10"
      smooth-tolerance="0.01"
      smooth-threshold="5"
    >
      <a-entity
        id="heart"
        gltf-model="#heartModel"
        position="0 0.22 0"
        rotation="0 0 0"
        scale="4 4 4"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("#hiroMarker");
    const status = document.querySelector("#status");
    const loading = document.querySelector("#loading");
    const scene = document.querySelector("a-scene");

    scene.addEventListener("loaded", () => {
      loading.classList.add("hidden");
    });

    marker.addEventListener("markerFound", () => {
      status.textContent = "✓ Marcador detectado. El corazón debería aparecer sobre él.";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent = "Marcador perdido. Vuelve a apuntar la cámara al marcador HIRO.";
    });

    window.addEventListener("load", () => {
      setTimeout(() => {
        loading.classList.add("hidden");
      }, 7000);
    });
  </script>
</body>
</html>
